<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Alterar Perguntas de Multipla Escolha.</title>
    <script>
        let perguntas = [];
        let indexAtual = -1;

        async function procurar(event) {
            event.preventDefault();
            const num = document.getElementById('numBusca').value;
            
            // Lê o ficheiro via API
            const res = await fetch('api.php?arquivo=perguntasMulti.json');
            perguntas = await res.json();
            
            indexAtual = perguntas.findIndex(p => p.numero == num);

            if (indexAtual !== -1) {
                document.getElementById('formAlterar').style.display = 'block';
                document.getElementById('numExibido').innerText = perguntas[indexAtual].numero;
                document.getElementById('novoPerg').value = perguntas[indexAtual].pergunta;
                document.getElementById('novoOp1').value = perguntas[indexAtual].op1;
                document.getElementById('novoOp2').value = perguntas[indexAtual].op2;
                document.getElementById('novoOp3').value = perguntas[indexAtual].op3;
                document.getElementById('novoOpture').value = perguntas[indexAtual].optrue;
            } else {
                alert("Pergunta não encontrada.");
            }
        }

        async function confirmarAlteracao(event) {
            event.preventDefault();
            
            // Atualiza o objeto no array
            perguntas[indexAtual].pergunta = document.getElementById('novoPerg').value;
            perguntas[indexAtual].op1 = document.getElementById('novoOp1').value;
            perguntas[indexAtual].op2 = document.getElementById('novoOp2').value;
            perguntas[indexAtual].op3 = document.getElementById('novoOp3').value;
            perguntas[indexAtual].optrue = document.getElementById('novoOpture').value;

            // Grava o array atualizado no ficheiro
            await fetch('api.php', {
                method: 'POST',
                body: JSON.stringify({ arquivo: 'perguntasMulti.json', dados: perguntas })
            });

            alert("Registro Alterado com sucesso.");
            location.reload();
        }
    </script>
</head>
<body>
    <button><a href="main.html">Voltar</a></button>
    <h1>Alteração de Perguntas de Multipla Escolha.</h1>
    <form onsubmit="procurar(event)">
        <label>Digite o Numero da Pergunta: </label>
        <input type="text" id="numBusca" required>
        <input type="submit" value="Procurar">
    </form>

    <div id="formAlterar" style="display:none;">
        <form onsubmit="confirmarAlteracao(event)">
            <table border="1">
                <tr><th>Numero</th><th>Pergunta</th><th>Opção 1</th><th>Opção 2</th><th>Opção 3</th><th>Opção Correta</th></tr>
                <tr>
                    <td id="numExibido"></td>
                    <td><input type="text" id="novoPerg" required></td>
                    <td><input type="text" id="novoOp1" required></td>
                    <td><input type="text" id="novoOp2" required></td>
                    <td><input type="text" id="novoOp3" required></td>
                    <td><input type="text" id="novoOpture" required></td>
                </tr>
            </table>
            <input type="submit" value="Alterar">
        </form>
    </div>
</body>
</html>
