<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Usuario.</title>
    <script>
        async function salvar(event) {
            event.preventDefault();
            
            const novoUsuario = {
                id: document.getElementById('id').value,
                nome: document.getElementById('nome').value,
                email: document.getElementById('email').value
            };

            // 1. Tenta ler o arquivo atual (via fetch)
            let usuarios = [];
            try {
                const response = await fetch('cadastro.json');
                if (response.ok) usuarios = await response.json();
            } catch (e) { usuarios = []; }

            // 2. Adiciona o novo
            usuarios.push(novoUsuario);

            // 3. Manda o PHP salvar no disco
            const salvarNoDisco = await fetch('salvar.php', {
                method: 'POST',
                body: JSON.stringify({ arquivo: 'cadastro.json', dados: usuarios })
            });

            if (salvarNoDisco.ok) {
                alert("Cadastro Concluido no arquivo JSON!");
                event.target.reset();
            }
        }
    </script>
</head>
<body>
    <button><a href="main.html">Voltar</a></button>
    <h1>Cadastro de Usuarios.</h1>
    <form onsubmit="salvar(event)">
        <label>ID: </label><input type="text" id="id" required>
        <label>Nome: </label><input type="text" id="nome" required>
        <label>Email: </label><input type="text" id="email" required>
        <input type="submit" value="Cadastrar">
    </form>
</body>
</html>
