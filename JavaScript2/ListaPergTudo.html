<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Listar Perguntas</title>
    <script>
        async function carregarTabelas() {
            // Lendo Discursivas
            try {
                const resDis = await fetch('perguntas.json');
                const disc = await resDis.json();
                const tabDis = document.getElementById('tabelaDiscursivas');
                disc.forEach(p => {
                    tabDis.innerHTML += `<tr><td>${p.numero}</td><td>${p.pergunta}</td><td>${p.resposta}</td></tr>`;
                });
            } catch(e) {}

            // Lendo Multipla Escolha
            try {
                const resMulti = await fetch('perguntasMulti.json');
                const multi = await resMulti.json();
                const tabMulti = document.getElementById('tabelaMulti');
                multi.forEach(p => {
                    tabMulti.innerHTML += `<tr><td>${p.numero}</td><td>${p.pergunta}</td><td>${p.op1}</td><td>${p.op2}</td><td>${p.op3}</td><td>${p.optrue}</td></tr>`;
                });
            } catch(e) {}
        }
        window.onload = carregarTabelas;
    </script>
</head>
<body>
    <button><a href="main.html">Voltar</a></button>
    <h2>---Perguntas Discursivas---</h2>
    <table border="1" id="tabelaDiscursivas">
        <tr><th>Numero</th><th>Pergunta</th><th>Resposta</th></tr>
    </table>

    <h2>---Perguntas de Multipla Escolha---</h2>
    <table border="1" id="tabelaMulti">
        <tr><th>Numero</th><th>Pergunta</th><th>Opção 1</th><th>Opção 2</th><th>Opção 3</th><th>Opção Correta</th></tr>
    </table>
</body>
</html>
